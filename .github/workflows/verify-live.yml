# Daily verification of the live record (Blueprint 1.3.1 §8): fetches the live bytes of the canonical texts, the release
# manifest and its signatures, recomputes the published hashes and verifies the Ed25519 signatures against the public key
# kept in this repository. A drift fails the run; the run history is public and linked from /archive.
name: verify-live
on:
  schedule:
    - cron: "40 3 * * *"   # daily, 03:40 UTC
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the live files
        run: |
          set -euo pipefail
          mkdir -p live/.well-known live/prompts
          for p in core.txt record.txt core.txt.sig record.txt.sig prompts/cz-machine-1.0.txt \
                   .well-known/cz-release-1.0.json .well-known/cz-release-1.0.json.sig .well-known/cz-record-signing.pub .well-known/civilization-zero.json; do
            curl -fsSL --retry 3 "https://civilizationzero.ai/$p" -o "live/$p"
          done
      - name: Hashes of the canonical texts match the record
        run: |
          set -euo pipefail
          for f in core.txt:record/CZ-CORE-1.0.txt record.txt:record/CZ-IR-1.0.txt; do
            live="live/${f%%:*}"; repo="${f##*:}"
            cmp "$live" "$repo" && echo "identical bytes: $live == $repo"
          done
          sha256sum live/core.txt live/record.txt live/prompts/cz-machine-1.0.txt live/.well-known/cz-release-1.0.json
          grep -q "92a8d1e2a1604c25b432685673be78184bf05c3b166893c437e0895b7b2d724a" <(sha256sum live/core.txt)
          grep -q "71e1488e631e090c0820bf8b78b1fda70ffacba1da146c36d8893600320fcc8d" <(sha256sum live/record.txt)
      - name: Release manifest and public key are the signed ones
        run: |
          set -euo pipefail
          cmp live/.well-known/cz-release-1.0.json site/signatures/cz-release-1.0.json
          cmp live/.well-known/cz-record-signing.pub site/sign/cz-record-signing.pub
          python3 - <<'EOF'
          import json, hashlib
          rel = json.load(open("live/.well-known/cz-release-1.0.json")); man = json.load(open("live/.well-known/civilization-zero.json"))
          h = {d["file"]: d["sha256"] for d in rel["documents"]}
          for f in ("core.txt", "record.txt"):
              assert hashlib.sha256(open("live/" + f, "rb").read()).hexdigest() == h[f], f
          assert hashlib.sha256(open("live/prompts/cz-machine-1.0.txt", "rb").read()).hexdigest() == rel["machine_prompt"]["sha256"]
          assert man["signature"]["release_manifest_sha256"] == hashlib.sha256(open("live/.well-known/cz-release-1.0.json", "rb").read()).hexdigest()
          assert man["signature"]["key_fingerprint"] == rel["key"]["fingerprint"]
          print("manifest consistent:", man["signature"]["status"], man["timestamp"]["status"])
          EOF
      - name: Signatures verify against the repository's public key
        run: |
          set -euo pipefail
          for f in core.txt record.txt .well-known/cz-release-1.0.json; do
            openssl pkeyutl -verify -pubin -inkey site/sign/cz-record-signing.pub -rawin -in "live/$f" -sigfile "live/$f.sig" && echo "verified: $f"
          done
          openssl pkey -pubin -in site/sign/cz-record-signing.pub -outform DER | sha256sum | grep -q 82662396484f627a63272bcd5ac19aae72def7aca2898216dc8e7f975dfc2263
