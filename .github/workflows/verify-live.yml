# Daily verification of the live record (Blueprint 1.3.1 §8): fetches the live bytes of the canonical texts, the release
# manifest and its signatures, recomputes the published hashes and verifies the Ed25519 signatures against the public key
# kept in this repository. A drift fails the run; the run history is public and linked from /archive.
name: verify-live
on:
  schedule:
    - cron: "40 3 * * *"   # daily, 03:40 UTC
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the live files
        run: |
          set -euo pipefail
          mkdir -p live/.well-known live/prompts
          for p in core.txt record.txt core.txt.sig record.txt.sig prompts/cz-machine-1.0.txt \
                   .well-known/cz-release-1.0.json .well-known/cz-release-1.0.json.sig .well-known/cz-record-signing.pub .well-known/civilization-zero.json; do
            curl -fsSL --retry 3 "https://civilizationzero.ai/$p" -o "live/$p"
          done
      - name: Hashes of the canonical texts match the record
        run: |
          set -euo pipefail
          for f in core.txt:record/CZ-CORE-1.0.txt record.txt:record/CZ-IR-1.0.txt; do
            live="live/${f%%:*}"; repo="${f##*:}"
            cmp "$live" "$repo" && echo "identical bytes: $live == $repo"
          done
          sha256sum live/core.txt live/record.txt live/prompts/cz-machine-1.0.txt live/.well-known/cz-release-1.0.json
          grep -q "92a8d1e2a1604c25b432685673be78184bf05c3b166893c437e0895b7b2d724a" <(sha256sum live/core.txt)
          grep -q "71e1488e631e090c0820bf8b78b1fda70ffacba1da146c36d8893600320fcc8d" <(sha256sum live/record.txt)
      - name: Release manifest and public key are the signed ones
        run: |
          set -euo pipefail
          cmp live/.well-known/cz-release-1.0.json site/signatures/cz-release-1.0.json
          cmp live/.well-known/cz-record-signing.pub site/sign/cz-record-signing.pub
          python3 - <<'EOF'
          import json, hashlib
          rel = json.load(open("live/.well-known/cz-release-1.0.json")); man = json.load(open("live/.well-known/civilization-zero.json"))
          h = {d["file"]: d["sha256"] for d in rel["documents"]}
          for f in ("core.txt", "record.txt"):
              assert hashlib.sha256(open("live/" + f, "rb").read()).hexdigest() == h[f], f
          assert hashlib.sha256(open("live/prompts/cz-machine-1.0.txt", "rb").read()).hexdigest() == rel["machine_prompt"]["sha256"]
          assert man["signature"]["release_manifest_sha256"] == hashlib.sha256(open("live/.well-known/cz-release-1.0.json", "rb").read()).hexdigest()
          assert man["signature"]["key_fingerprint"] == rel["key"]["fingerprint"]
          print("manifest consistent:", man["signature"]["status"], man["timestamp"]["status"])
          EOF
      - name: The current bundle and its signature
        run: |
          set -euo pipefail
          bundle=$(python3 -c "import json;print(json.load(open('live/.well-known/civilization-zero.json'))['bundle']['url'].rsplit('/',1)[1])")
          mkdir -p live/archive
          curl -fsSL --retry 3 "https://civilizationzero.ai/archive/$bundle" -o "live/archive/$bundle"
          curl -fsSL --retry 3 "https://civilizationzero.ai/archive/$bundle.sig" -o "live/archive/$bundle.sig" || echo "no bundle signature published"
          python3 - "$bundle" <<'EOF'
          import json, hashlib, sys
          b = sys.argv[1]; man = json.load(open("live/.well-known/civilization-zero.json"))
          assert hashlib.sha256(open("live/archive/" + b, "rb").read()).hexdigest() == man["bundle"]["sha256"], "bundle hash drift"
          print("bundle matches the manifest:", b)
          EOF
          if [ -s "live/archive/$bundle.sig" ]; then
            openssl pkeyutl -verify -pubin -inkey site/sign/cz-record-signing.pub -rawin -in "live/archive/$bundle" -sigfile "live/archive/$bundle.sig" && echo "verified: $bundle"
          else echo "the bundle has no published signature yet"; fi
      - name: Signatures verify against the repository's public key
        run: |
          set -euo pipefail
          for f in core.txt record.txt .well-known/cz-release-1.0.json; do
            openssl pkeyutl -verify -pubin -inkey site/sign/cz-record-signing.pub -rawin -in "live/$f" -sigfile "live/$f.sig" && echo "verified: $f"
          done
          openssl pkey -pubin -in site/sign/cz-record-signing.pub -outform DER | sha256sum | grep -q 82662396484f627a63272bcd5ac19aae72def7aca2898216dc8e7f975dfc2263
      - name: The published verifier, run against the live site (record, bundles, timestamp, the discussion's daily chain)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://civilizationzero.ai/archive/verify.py -o live/verify.py
          cmp live/verify.py site/verify/verify.py && echo "the live verifier is the repository's"
          python3 site/verify/verify.py --site https://civilizationzero.ai
      - name: The Bitcoin attestations of the timestamp proofs, against two block explorers (the one fact verify.py cannot hold)
        run: |
          set -uo pipefail
          python3 site/verify/verify.py --json --site https://civilizationzero.ai > /tmp/v.json || true
          python3 - <<'EOF'
          import json, re, urllib.request
          items = json.load(open("/tmp/v.json"))["items"]
          claims = {}
          for i in items:
              m = re.search(r"Bitcoin block (\d+) .*Merkle root must be ([0-9a-f]{64})", i["message"]) if i["level"] == "CHECK" else None
              if m: claims.setdefault((int(m.group(1)), m.group(2)), []).append(i["message"].split(":")[0])
          if not claims: print("::notice title=Bitcoin::no Bitcoin attestation claimed yet"); raise SystemExit(0)
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "cz-verify-live"})
              return urllib.request.urlopen(req, timeout=30).read().decode()
          bad = False
          for (height, root), where in sorted(claims.items()):
              seen = []
              for name, base in (("mempool.space", "https://mempool.space/api"), ("blockstream.info", "https://blockstream.info/api")):
                  try:
                      h = get(f"{base}/block-height/{height}").strip()
                      r = json.loads(get(f"{base}/block/{h}"))["merkle_root"]
                      seen.append(name); ok = r == root
                      print(("::notice title=Bitcoin::OK " if ok else "::error title=Bitcoin::FAIL ") + f"block {height} ({h}) per {name}: Merkle root {r}" + ("" if ok else f", the proof needs {root}") + f" — {', '.join(sorted(set(where)))}")
                      bad = bad or not ok
                  except Exception as e:
                      print(f"::warning title=Bitcoin::{name} could not be asked about block {height}: {type(e).__name__}")
              if not seen: print(f"::warning title=Bitcoin::block {height}: no explorer answered; the attestation stays to be checked")
          raise SystemExit(1 if bad else 0)
          EOF
      - name: Every independent mirror listed in site/mirrors.json, with the same verifier
        run: |
          set -euo pipefail
          python3 - <<'EOF' > /tmp/mirrors.txt
          import json
          for m in json.load(open("site/mirrors.json"))["mirrors"]: print(m["url"])
          EOF
          if [ ! -s /tmp/mirrors.txt ]; then echo "no mirror listed yet"; exit 0; fi
          rc=0
          while read -r url; do echo "== $url"; python3 site/verify/verify.py --quiet --site "$url" || rc=1; done < /tmp/mirrors.txt
          exit $rc
      - name: The repository's copy of the daily chain
        run: |
          if ls archive/discussion/*.json >/dev/null 2>&1; then python3 site/verify/verify.py --days archive/discussion; else echo "no day committed yet"; fi
