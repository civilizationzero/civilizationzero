# Tells search engines which pages the site has (IndexNow: Bing, Yandex, Seznam, Naver and Yep share what one of them
# receives) and asks the Internet Archive to keep a copy of every page (Blueprint 1.3.1 §8: snapshots at release, at launch
# and at each anniversary). Pages come from the site's own sitemap. Run by hand after a release or a change of pages; the
# snapshot addresses are printed and kept as the run's artifact, to be listed on /archive and in the manifest.
name: announce
on:
  workflow_dispatch:
    inputs:
      indexnow:
        description: "Send the sitemap's addresses to IndexNow"
        type: boolean
        default: true
      archive:
        description: "Also ask the Internet Archive to save every page"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  announce:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: The site's pages, from its sitemap
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://civilizationzero.ai/sitemap.txt -o urls.txt
          wc -l urls.txt
      - name: IndexNow
        if: ${{ inputs.indexnow }}
        run: |
          set -euo pipefail
          KEY=$(python3 -c "import re;print(re.search(r'INDEXNOW_KEY = \"([0-9a-f]{32})\"', open('site/lib.py').read()).group(1))")
          test "$(curl -fsSL https://civilizationzero.ai/$KEY.txt)" = "$KEY"   # the key file is served
          python3 - "$KEY" <<'EOF'
          import json, sys, urllib.request
          key = sys.argv[1]
          urls = [u.strip() for u in open("urls.txt") if u.strip()]
          body = json.dumps({"host": "civilizationzero.ai", "key": key, "keyLocation": f"https://civilizationzero.ai/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req, timeout=60) as r:
              print("IndexNow:", r.status, f"({len(urls)} addresses)")   # 200 or 202: received
              if r.status not in (200, 202): sys.exit(1)
          EOF
      - name: Internet Archive — save every page
        if: ${{ inputs.archive }}
        run: |
          set +e -u   # one slow or refused save must not stop the others (GitHub runs steps with bash -e)
          while read -r u; do
            [ -z "$u" ] && continue
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 -A "civilizationzero.ai announce workflow" "https://web.archive.org/save/$u")
            echo "save $code $u"
            sleep 15
          done < urls.txt
          sleep 60
      - name: Internet Archive — the latest snapshot of each page, kept in the repository
        run: |
          set +e -u
          printf 'page\tsnapshot\n' > ia.tsv
          while read -r u; do
            [ -z "$u" ] && continue
            snap=$(curl -s --max-time 60 "https://archive.org/wayback/available?url=$u&timestamp=$(date -u +%Y%m%d%H%M%S)" | python3 -c "import json,sys
          try: print(json.load(sys.stdin).get('archived_snapshots',{}).get('closest',{}).get('url',''))
          except Exception: print('')")
            printf '%s\t%s\n' "${u#https://civilizationzero.ai}" "$snap" >> ia.tsv
          done < urls.txt
          found=$(awk -F'\t' 'NR > 1 && $2 != ""' ia.tsv | wc -l); total=$(($(wc -l < ia.tsv) - 1))
          echo "::notice title=Internet Archive::$found of $total pages have a snapshot"
          mkdir -p archive/internet-archive && cp ia.tsv archive/internet-archive/snapshots.tsv
          git config user.name "cz-announce"; git config user.email "record@civilizationzero.ai"
          git add archive/internet-archive/snapshots.tsv
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "Internet Archive: the latest snapshot of each page ($found of $total)"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
