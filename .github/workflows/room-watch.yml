# Watches the open room (Blueprint 1.3.1 §7.5): every hour it reads the public moderation log, every page of it, and when a
# classifier flag has no human decision yet — no hide, unhide, redact or unredact of its entry after it, and no "keep" recorded
# for it — opens (or updates) one issue titled "Moderation queue" so that a human sees it. It never hides anything.
name: room-watch
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - name: Read the public log (every page) and the newest entries
        id: read
        env:
          SITE: https://civilizationzero.ai
        run: |
          set -euo pipefail
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, sys, time, urllib.request
          SITE = os.environ["SITE"]
          def get(path):
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(SITE + path, headers={"Accept": "application/json", "User-Agent": "civilizationzero-room-watch"})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.load(r)
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(5)
          # GET /api/moderation pages the log (after, next_after) and the "keep" decisions (kept_after, next_kept_after) with
          # cursors of their own; both are followed to the end
          log, kept, after, kept_after, more_log, more_kept, pages = [], [], 0, 0, True, True, 0
          while more_log or more_kept:
              pages += 1
              if pages > 10000:
                  sys.exit("room-watch: more than 10,000 pages of the moderation log; stopped")
              mod = get(f"/api/moderation?after={after}&kept_after={kept_after}")
              if more_log:
                  log += mod.get("log", [])
                  nxt = mod.get("next_after")
                  if nxt is None:
                      more_log = False
                  elif nxt <= after:
                      sys.exit("room-watch: the log's cursor did not advance")
                  else:
                      after = nxt
              if more_kept:
                  k = mod.get("kept_after_flag", [])
                  if not isinstance(k, list):
                      sys.exit("room-watch: the keep decisions could not be read just now; nothing is reported this hour")
                  kept += k
                  nxt = mod.get("next_kept_after")
                  if nxt is None:
                      more_kept = False
                  elif nxt <= kept_after:
                      sys.exit("room-watch: the keep decisions' cursor did not advance")
                  else:
                      kept_after = nxt
          latest = get("/api/entries?before=999999999999&limit=5")
          # a flag is decided when a human acted on its entry after it (hide, unhide, redact, unredact) or kept it (a review of that flag)
          last_human = {}
          for l in log:
              if l["actor"] == "human" and l["action"] in ("hide", "unhide", "redact", "unredact"):
                  last_human[l["entry_id"]] = max(last_human.get(l["entry_id"], 0), l["id"])
          kept_flags = {k["flag_log_id"] for k in kept}
          # and, as the administrator's page counts them, a flag on an entry that is hidden or redacted now is not awaiting anyone
          # (a hide can land before the classifier's flag is written)
          not_published = {h["id"] for h in mod.get("hidden_and_redacted", [])}
          flags = [l for l in log if l["action"] == "flag" and l["id"] not in kept_flags and l["entry_id"] not in not_published and last_human.get(l["entry_id"], 0) < l["id"]]
          lines = [f"- entry #{f['entry_id']} — {f['category']} (score {f['classifier_score']}) — https://civilizationzero.ai/discuss/{f['entry_id']}" for f in flags]
          n = len(latest.get("entries", []))
          newest = latest["entries"][0]["id"] if n else 0
          print(f"pending={len(flags)}")
          print(f"newest={newest}")
          print("body<<END")
          print(f"Classifier flags awaiting a human decision: **{len(flags)}** (newest entry id: {newest}; unclassified entries: {mod.get('classifier', {}).get('unclassified_entries', 0)}).")
          print()
          print("\n".join(lines) if lines else "None.")
          print()
          print("Decide with `POST /api/moderation` (hide / unhide / redact / unredact / correct_translation) — grounds and never-grounds are in the rules. This issue is updated hourly by the room-watch workflow; close it when the queue is empty.")
          print("END")
          EOF
      - name: Open or update the queue issue
        if: steps.read.outputs.pending != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.read.outputs.body }}
        run: |
          set -euo pipefail
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Moderation queue in:title" --json number --jq '.[0].number // empty')
          if [ -z "$num" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Moderation queue" --body "$BODY"
          else
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          fi
