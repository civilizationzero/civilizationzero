# Copies the daily chains out of the site (Blueprint 1.3.1 §7.2, §8): the discussion's and, once the Adoption Register has
# opened, the register's. After the site hashes a finished UTC day (its cron is set for 00:20 UTC; the hosting plan runs it at
# some time in that hour), this job — at 01:20 and again at 07:20 UTC, in case a run is late or fails — fetches every hashed
# day not yet in archive/discussion/ (or archive/register/), checks that each snapshot's lines hash to the day's hash, checks
# the WHOLE chain with the published verifier (site/verify/verify.py), timestamps each new day's hash with OpenTimestamps (the
# .log file holds exactly the hashed bytes, so the proof commits to the day's hash itself) and commits the snapshot, the bytes
# and the proof. A day rewritten on the site afterwards would contradict this copy, its timestamp, and every clone of the
# repository. The job never edits a day it has already committed. One chain that cannot be fetched does not hold back the other.
name: daily-archive
on:
  schedule:
    - cron: "20 1,7 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repository-writes
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet opentimestamps-client || pip install --quiet --break-system-packages opentimestamps-client
      - name: Fetch every hashed day not yet in the repository
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import hashlib, json, os, time, urllib.request
          ORIGIN = os.environ.get("CZ_ORIGIN", "https://civilizationzero.ai")
          CHAINS = (("discussion", "/archive/entries.json", "/archive/entries/%s.json"),
                    ("register", "/archive/register.json", "/archive/register/%s.json"))
          def get(url):
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "cz-daily-archive", "Accept": "application/json"})
                      return urllib.request.urlopen(req, timeout=60).read()
                  except Exception as e:
                      if attempt == 3: raise
                      time.sleep(10 * (attempt + 1))
          new, errors = [], []
          for chain, index_path, day_path in CHAINS:
              try:
                  index = json.loads(get(ORIGIN + index_path))
                  for d in index.get("days", []):
                      day, base = d["day"], "archive/%s/%s" % (chain, d["day"])
                      if os.path.exists(base + ".json"): continue
                      raw = get(ORIGIN + day_path % day)
                      log = json.loads(raw)["log"]
                      data = ((log.get("prev") or "") + "\n" + "\n".join(log.get("lines") or [])).encode("utf-8")
                      assert hashlib.sha256(data).hexdigest() == log["sha256"] == d["sha256"], f"{chain} {day}: the snapshot does not hash to the day's hash"
                      os.makedirs("archive/" + chain, exist_ok=True)
                      with open(base + ".json", "wb") as f: f.write(raw)
                      with open(base + ".log", "wb") as f: f.write(data)
                      new.append(chain + "/" + day)
              except Exception as e:
                  errors.append("%s: %s" % (chain, e))
          with open("/tmp/new-days", "w") as f: f.write("\n".join(new))
          with open("/tmp/errors", "w") as f: f.write("\n".join(errors))
          print("new days:", ", ".join(new) or "none")
          for e in errors: print("::error::" + e)
          EOF
      - name: Timestamp each new day's hash
        run: |
          set -euo pipefail
          for day in $(cat /tmp/new-days); do
            ots stamp "archive/$day.log"
            ots info "archive/$day.log.ots" | head -3
          done
      - name: Check each whole chain with the published verifier
        run: |
          set -euo pipefail
          n=0
          for chain in discussion register; do
            if ls archive/$chain/*.json >/dev/null 2>&1; then python3 site/verify/verify.py --days archive/$chain; n=$((n + 1)); fi
          done
          [ $n -gt 0 ] || echo "no day hashed yet"
      - name: Commit
        run: |
          set -euo pipefail
          if [ ! -s /tmp/new-days ]; then echo "nothing new"; exit 0; fi
          git config user.name "cz-daily-archive"; git config user.email "record@civilizationzero.ai"
          what=""
          for chain in discussion register; do
            days=$(grep "^$chain/" /tmp/new-days | cut -d/ -f2 | paste -sd, -) || true
            [ -n "$days" ] || continue
            git add "archive/$chain"
            label=$([ "$chain" = discussion ] && echo "Discussion" || echo "Register")
            what="${what:+$what; }$label $days"
          done
          git commit -q -m "Daily archive: $what — snapshot, the exact hashed bytes, OpenTimestamps proof"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
      - name: A chain that could not be fetched fails the run (the next run fetches it)
        run: |
          if [ -s /tmp/errors ]; then cat /tmp/errors; exit 1; fi
