# Copies the discussion's daily chain out of the site (Blueprint 1.3.1 §7.2, §8): about half an hour after the site hashes a
# finished UTC day (cron 00:20 UTC), this job fetches every hashed day not yet in archive/discussion/, checks that each
# snapshot's lines hash to the day's hash, checks the WHOLE chain with the published verifier (site/verify/verify.py),
# timestamps each new day's hash with OpenTimestamps (the .log file holds exactly the hashed bytes, so the proof commits to the
# day's hash itself) and commits the snapshot, the bytes and the proof. A day rewritten on the site afterwards would contradict
# this copy, its timestamp, and every clone of the repository. The job never edits a day it has already committed.
name: daily-archive
on:
  schedule:
    - cron: "50 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repository-writes
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet opentimestamps-client || pip install --quiet --break-system-packages opentimestamps-client
      - name: Fetch every hashed day not yet in the repository
        run: |
          set -euo pipefail
          mkdir -p archive/discussion
          python3 - <<'EOF'
          import hashlib, json, os, time, urllib.request
          def get(url):
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "cz-daily-archive", "Accept": "application/json"})
                      return urllib.request.urlopen(req, timeout=60).read()
                  except Exception as e:
                      if attempt == 3: raise
                      time.sleep(10 * (attempt + 1))
          index = json.loads(get("https://civilizationzero.ai/archive/entries.json"))
          new = []
          for d in index.get("days", []):
              day, base = d["day"], "archive/discussion/" + d["day"]
              if os.path.exists(base + ".json"): continue
              raw = get(f"https://civilizationzero.ai/archive/entries/{day}.json")
              log = json.loads(raw)["log"]
              data = ((log.get("prev") or "") + "\n" + "\n".join(log.get("lines") or [])).encode("utf-8")
              assert hashlib.sha256(data).hexdigest() == log["sha256"] == d["sha256"], f"{day}: the snapshot does not hash to the day's hash"
              with open(base + ".json", "wb") as f: f.write(raw)
              with open(base + ".log", "wb") as f: f.write(data)
              new.append(day)
          with open("/tmp/new-days", "w") as f: f.write("\n".join(new))
          print("new days:", ", ".join(new) or "none")
          EOF
      - name: Timestamp each new day's hash
        run: |
          set -euo pipefail
          for day in $(cat /tmp/new-days); do
            ots stamp "archive/discussion/$day.log"
            ots info "archive/discussion/$day.log.ots" | head -3
          done
      - name: Check the whole chain with the published verifier
        run: |
          if ls archive/discussion/*.json >/dev/null 2>&1; then python3 site/verify/verify.py --days archive/discussion; else echo "no day hashed yet"; fi
      - name: Commit
        run: |
          set -euo pipefail
          if [ ! -s /tmp/new-days ]; then echo "nothing new"; exit 0; fi
          git config user.name "cz-daily-archive"; git config user.email "record@civilizationzero.ai"
          git add archive/discussion
          git commit -q -m "Discussion archive: $(paste -sd, /tmp/new-days) — snapshot, the exact hashed bytes, OpenTimestamps proof"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
